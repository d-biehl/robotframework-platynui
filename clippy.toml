# Clippy configuration for the PlatynUI workspace.
#
# This file lives at the workspace root and applies to all crates.

# --- Disallowed types ---
# Prefer std equivalents over once_cell. The once_cell crate was fully replaced
# by std::sync::{OnceLock, LazyLock} which are stable since Rust 1.70 / 1.80.
disallowed-types = [
    { path = "once_cell::sync::Lazy",     reason = "Use std::sync::LazyLock instead (stable since Rust 1.80)" },
    { path = "once_cell::sync::OnceCell",  reason = "Use std::sync::OnceLock instead (stable since Rust 1.70)" },
    { path = "once_cell::unsync::Lazy",    reason = "Use std::cell::LazyCell instead (stable since Rust 1.80)" },
    { path = "once_cell::unsync::OnceCell", reason = "Use std::cell::OnceCell instead (stable since Rust 1.70)" },
]

# --- Disallowed methods ---
# `Client::get_credentials` reads SO_PEERCRED through a `rustix` whose `UCred.pid`
# is a non-zero `Pid`, so a peer in a PID namespace the compositor cannot see —
# reported by the kernel as process id 0 — cannot be represented and the accessor
# panics inside `wayland-backend`, aborting the whole session. The compositor
# establishes a client's identity itself when it accepts the connection
# (`apps/wayland-compositor/src/client.rs`).
#
# `socket_peercred` is the same read on the client side: it returns a `UCred`
# whose `pid` is a non-zero `Pid`, so the process id 0 the kernel reports for a
# peer in a foreign PID namespace breaks that invariant — undefined behaviour,
# not an error. Read SO_PEERCRED through `nix::sys::socket::getsockopt` with
# `sockopt::PeerCredentials`, whose credentials can carry 0.
#
# `allow-invalid`: on Windows `rustix` is in the graph without its `net` module,
# so the path cannot resolve there and clippy would warn about the entry itself.
disallowed-methods = [
    { path = "wayland_server::Client::get_credentials", reason = "panics for a peer in a foreign PID namespace; use the identity captured in ClientState" },
    { path = "rustix::net::sockopt::socket_peercred", reason = "UCred.pid is a non-zero Pid, so a peer in a foreign PID namespace (pid 0) is undefined behaviour; use nix getsockopt(sockopt::PeerCredentials)", allow-invalid = true },
]

# --- Function signature limits ---
# Default is 7, but low-level drawing/FFI functions legitimately need more.
too-many-arguments-threshold = 10
