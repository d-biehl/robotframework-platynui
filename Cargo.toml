[workspace]
members = ["crates/*", "apps/*", "packages/*"]
# apps/test-app-qt and apps/test-app-qml are Python (PySide6) test fixtures,
# apps/test-app-gtk3 and apps/test-app-gtk4 Python (PyGObject) test fixtures,
# apps/large-tree-qt a Python measurement helper, and apps/test-app-swing a Java
# (Swing) test fixture — none is a Cargo crate. packages/provider-java is pure
# data: a wheel carrying the Java agent JAR, with no Rust in it.
exclude = [
    "apps/test-app-qt",
    "apps/test-app-qml",
    "apps/test-app-gtk3",
    "apps/test-app-gtk4",
    "apps/test-app-swing",
    "apps/large-tree-qt",
    "packages/provider-java",
]
default-members = ["crates/playground"]
resolver = "3"

[workspace.package]
version = "0.13.0-dev.2"
keywords = [
    "robotframework",
    "gui",
    "automation",
    "testing",
    "desktop",
    "platynui",
]
categories = ["development-tools", "testing"]
edition = "2024"
documentation = "https://github.com/imbus/robotframework-PlatynUI"
repository = "https://github.com/imbus/robotframework-PlatynUI"
authors = ["Daniel Biehl <daniel.biehl@imbus.de>"]
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unused_crate_dependencies = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
nursery = { level = "allow", priority = -1 }
complexity = { level = "warn", priority = -1 }
disallowed_types = "deny"
disallowed_methods = "deny"
non_std_lazy_statics = "deny"

# The profile of the release wheels (`just build-*-wheel` and CI). It optimizes
# for speed exactly like `release` (opt-level 3) and makes the binaries smaller:
# whole-program LTO and a single codegen unit let the optimizer inline and drop
# code across crates, and the symbol table is stripped. The price is build time,
# which is why everyday `--release` builds keep Cargo's faster defaults.
# - Stripping costs function names in a backtrace. On Windows MSVC the symbols
#   sit in a separate PDB rather than in the binary, and a wheel does not carry
#   the PDB, so there the binaries shrink far less than on Linux.
# - No `panic = "abort"`: the native module needs unwinding, so that a Rust
#   panic becomes a Python exception instead of ending the interpreter.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
