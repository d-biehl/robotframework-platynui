[workspace]
members = ["crates/*", "apps/*", "packages/*"]
# apps/test-app-qt is a Python (PySide6) test fixture, not a Cargo crate.
exclude = ["apps/test-app-qt"]
default-members = ["crates/playground"]
resolver = "3"

[workspace.package]
version = "0.13.0-dev.2"
description = "Cross-platform UI automation toolkit for Robot Framework with XPath-based element selection"
readme = "README.md"
keywords = [
    "robotframework",
    "gui",
    "automation",
    "testing",
    "desktop",
    "platynui",
]
categories = ["development-tools", "testing"]
edition = "2024"
homepage = "https://github.com/imbus/robotframework-PlatynUI"
documentation = "https://github.com/imbus/robotframework-PlatynUI"
repository = "https://github.com/imbus/robotframework-PlatynUI"
authors = ["Daniel Biehl <daniel.biehl@imbus.de>"]
license = "Apache-2.0"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unused_crate_dependencies = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
nursery = { level = "allow", priority = -1 }
complexity = { level = "warn", priority = -1 }
disallowed_types = "deny"
non_std_lazy_statics = "deny"
