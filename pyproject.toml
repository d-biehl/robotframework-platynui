[project]
name = "robotframework-PlatynUI"
version = "0.13.0-dev.2"
description = "Cross-platform UI automation toolkit for Robot Framework with XPath-based element selection"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Biehl", email = "daniel.biehl@imbus.de" }]
maintainers = [{ name = "Daniel Biehl", email = "daniel.biehl@imbus.de" }]
keywords = [
    "robotframework",
    "automation",
    "testing",
    "ui",
    "xpath",
    "cross-platform",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
]
dependencies = [
    "robotframework>=7.0.0",
    "platynui-native==0.13.0-dev.2",
    "typing-extensions",
    "robotframework-pythonlibcore>=4.4.0",
    "robotframework-assertion-engine>=3.0.0",
]

[project.optional-dependencies]
cli = ["platynui-cli==0.13.0-dev.2"]
inspector = ["platynui-inspector==0.13.0-dev.2"]
# Java UI toolkit support. Installing this extra is the consent for in-JVM
# instrumentation; pinned exactly because an agent cannot be unloaded from a JVM,
# so a version mismatch has exactly one remedy — restart the application.
java = ["platynui-provider-java==0.13.0-dev.2"]
all = [
    "platynui-cli==0.13.0-dev.2",
    "platynui-inspector==0.13.0-dev.2",
    "platynui-provider-java==0.13.0-dev.2",
]

[project.urls]
Homepage = "https://github.com/imbus/robotframework-PlatynUI"
Documentation = "https://github.com/imbus/robotframework-PlatynUI#readme"
Changelog = "https://github.com/imbus/robotframework-PlatynUI/blob/main/CHANGELOG.md"
Issues = "https://github.com/imbus/robotframework-PlatynUI/issues"
Source = "https://github.com/imbus/robotframework-PlatynUI"


[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PlatynUI"

[tool.uv.sources]
platynui-native = { workspace = true }
platynui-cli = { workspace = true }
platynui-inspector = { workspace = true }
platynui-provider-java = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "commitizen>=4.9.1",
    "mypy>=1.17.1",
    "pytest>=8.4.2",
    "robotframework-robocop>=8.0.0",
    "ruff>=0.12.11",
    "semantic-version>=2.10.0",
    "pyright[nodejs]>=1.1.408",
    "pre-commit>=4.6.0",
    "robotcode[analyze,repl,runner]>=2.6.2",
    # Powers the Qt test app (apps/test-app-qt) driven by the qt acceptance suite.
    "PySide6>=6.7",
]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.12"

[tool.cibuildwheel]
skip = ["*-musllinux_i686"]

[tool.commitizen]
name = "cz_conventional_commits"
bump_message = "chore(release): bump version $current_version → $new_version"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "scm"
update_changelog_on_bump = false
major_version_zero = true
changelog_incremental = true
changelog_merge_prerelease = true
gpg_sign = true
annotated_tag = true
pre_bump_hooks = [
    "uv run scripts/update-git-versions.py",
    "uv run scripts/update-changelog.py",
    "cargo update -w --offline --recursive --verbose",
    "uv lock -U --offline",
    "git add .",
]

[tool.ruff]
line-length = 120
target-version = "py312"
include = [
    "src/**/*.py",
    "packages/**/*.py",
    "apps/**/*.py",
    "examples/**/*.py",
    "tests/**/*.py",
    "dev-docs/**/*.py",
]

[tool.ruff.lint]
# We deliberately run on Ruff's default rule set rather than pinning `select`.
# Since 0.16 that default spans ~410 rules; `extend-select` below adds the
# families it does not cover (pep8-naming in particular is absent from it).
# The trade-off: a Ruff upgrade can widen the default set again and surface
# new findings. That is intended — triage them and extend `ignore` here.
ignore = [
    "E741",
    "N805",
    "N999",
    "RUF012",
    "RUF006",
    "ISC001",
    "D100",   # ignore missing docstring in module
    "D102",   # ignore missing docstring in public method
    "D104",   # ignore missing docstring in public package
    "D105",   # ignore missing docstring in magic methods
    "D107",   # ignore missing docstring in __init__ methods
    # Robot Framework resolves annotations at runtime to convert keyword
    # arguments. A PEP 695 `type X = ...` alias is a lazy TypeAliasType that
    # its converter does not resolve, so explicit `TypeAlias` stays.
    "UP040",
]
# Families the default set does not fully cover. The formerly commented-out
# entries here (UP, B, SIM, TRY, ...) were dropped: Ruff's defaults enable
# them now, so opting out would mean listing them in `ignore` instead.
extend-select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "YTT",
    "DTZ",
    "T10",
    "ISC",
    "G",
    "PIE",
    "PT",
    "Q",
    "RET",
    "RSE",
    "RUF",
]

flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }


[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["PlatynUI", "platynui_runtime"]
known-third-party = ["robot", "pythonlibcore"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D101", "D103"]
"**/tests/**/*.py" = ["D"]
"dev-docs/**/*.py" = ["D"]
# `__locator__` is installed by the `locator(...)` decorator, so it is not
# declared on the target classes. getattr/setattr keep mypy --strict happy;
# the direct attribute access B009/B010 suggest would fail type checking.
"src/PlatynUI/core/locator.py" = ["B010"]
"src/PlatynUI/ui/application.py" = ["B009"]
"src/PlatynUI/BareMetal/__init__.py" = ["B009"]
"tests/PlatynUI/test_locator.py" = ["B009"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
reportMissingModuleSource = false
reportUnknownVariableType = false
reportUntypedClassDecorator = false
reportUnknownParameterType = false
reportUnknownMemberType = false
reportUnusedFunction = true
include = ["packages", "src", "tests"]
venvPath = '.'
venv = ".venv"

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
implicit_reexport = false
implicit_optional = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
explicit_package_bases = true
namespace_packages = true
# `type-abstract` is disabled because pattern classes (subclasses of
# `core.patterns.PatternBase`) are passed as lookup keys to
# `Adapter.get_pattern(type[P])` / `Adapter.supports_pattern(type[PatternBase])`,
# never as constructors. mypy correctly notes that the abstract classes
# could in theory be instantiated, but in our design they are markers:
# pattern instances are produced exclusively by adapters/proxies and
# returned to the caller. Pyright does not raise this diagnostic at all,
# so nothing is lost in the editor either — but note that pyright is a
# development-environment tool here and is not run by CI, so mypy is the
# only automated type gate.
disable_error_code = ["type-abstract"]
# The Python fixture apps (apps/test-app-*/main.py) are NOT listed here: they are
# standalone PEP 723 scripts that all share the module name "main" (their directories
# are not importable packages), which mypy rejects as duplicate modules in one run.
# The `just mypy` recipe checks each of them in a separate invocation instead.
files = [
    "src",
    "packages/native/python",
    "packages/native/tests",
    "packages/provider-java/src",
    "tests",
]
exclude = [
    '^\.mypy_cache/',
    '^\.venv/',
    "^build/",
    "^dist/",
    "^out/",
    "^playground/",
    "^scripts/",
]
mypy_path = ["src", "packages/native/python"]

[[tool.mypy.overrides]]
module = ["robot.*", "robotlibcore.*"]
ignore_missing_imports = true
no_implicit_reexport = false
