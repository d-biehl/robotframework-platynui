paths = "tests"
# log-level = "TRACE"

# ---------------------------------------------------------------------------
# Tags encode three ORTHOGONAL dimensions; profiles select by combining them:
#
#   Test level:        `acceptance` — drives a fixture app end-to-end through
#                      real providers (tests/acceptance/*). Other levels (e.g.
#                      the BareMetal keyword-behavior suites) carry no level
#                      tag until a second kind of the same level exists.
#   Build requirement: `real` -> needs the non-mock build      (just build-native)
#                      `mock` -> needs the mock-provider build (just build-native-mock)
#                      The lanes need DIFFERENT native builds and CANNOT share
#                      one: a mock-provider build makes `Runtime()` resolve the
#                      built-in mock tree instead of the real platform provider.
#                      Pair the build with the tag/profile (CI: a job per lane).
#   Platform binding:  `platform:x11` / `platform:wayland` / `platform:windows`
#                      on platform-bound suites/tests. No platform tag = runs on
#                      every lane. Each lane profile below selects by EXCLUDING
#                      the foreign platforms' tags, so untagged suites stay in.
#
# Environment fitness is decided here, by selection — never by runtime
# `Skip If` guards inside a suite (see dev-docs/testing-strategy.md).
#
# Profiles SELECT within the suite tree (tags), they never RESHAPE it: none of
# them narrows `paths`. A profile-specific `paths` would move the root suite
# (`tests/acceptance` alone makes the root `Acceptance` instead of `Tests`), so
# every longname would shift with the profile — and an editor that built its
# test tree without the profile then selects nothing ("Suite 'Acceptance'
# contains no tests after model modifiers"). Tag selection alone reaches the
# same tests with stable longnames.
# ---------------------------------------------------------------------------

# Real-provider acceptance lane: drive the test apps under tests/acceptance/
# through the real platform runtime, inside an isolated graphical session.
# REQUIRES the non-mock native build (just build-native).
#
# `real` itself establishes no session — it is the runnable select-everything
# parent for discovery and dry runs. Run a lane through its platform profile,
# which brings its own session (see `wrapper` below):
#   uv run robotcode --profile real-wayland run    # PlatynUI compositor
#   uv run robotcode --profile real-x11 run        # X11 (Xephyr, Xvfb when headless)
#   PLATYNUI_BACKEND=headless …                    # no visible window
# or via `just test-acceptance-compositor` / `just test-acceptance-x11`.
[profiles.real]
description = "Real-provider acceptance suites under tests/acceptance (tags 'acceptance' AND 'real'; needs the non-mock build)"
includes = ["acceptanceANDreal"]

# Mock lane: drive the PlatynUI.BareMetal library against the built-in mock tree.
# Deterministic, needs no display, runs on any OS. REQUIRES the mock-provider
# native build (just build-native-mock). Run with `robotcode --profile mock run`
# (or `just test-baremetal`).
# Per-platform refinements of `real`. The session script / just recipes pick
# the one matching the session they establish; `real` itself stays runnable as
# the select-everything parent (discover/dry-run).
[profiles.real-x11]
description = "Real lane on an X11 session (excludes wayland/windows-only suites)"
inherits = ["real"]
excludes = ["platform:wayland", "platform:windows"]
# RobotCode runs the test execution through this command prefix and appends its
# own command line to it (`wrapper`, RobotCode >= 2.7). The session scripts bring
# up the isolated display + AT-SPI stack, platynui-robot-session.sh builds the
# fixtures and finally `exec`s the appended robotcode run inside that session.
# Only commands that execute Robot Framework are wrapped (run/debug/repl) —
# discovery and the language server never start a session. Backend selection
# stays with the scripts (`PLATYNUI_BACKEND=headless` for CI/no display).
wrapper = ["scripts/startxsession.sh", "--", "scripts/platynui-robot-session.sh"]

[profiles.real-wayland]
description = "Real lane on a Wayland session (excludes x11/windows-only suites)"
inherits = ["real"]
excludes = ["platform:x11", "platform:windows"]
wrapper = ["scripts/startcompositor.sh", "--", "scripts/platynui-robot-session.sh"]

[profiles.real-windows]
description = "Real lane on the Windows desktop (excludes x11/wayland-only suites)"
inherits = ["real"]
excludes = ["platform:x11", "platform:wayland"]

[profiles.mock]
description = "BareMetal RF suites against the built-in mock tree (tag 'mock'; needs the mock-provider build)"
includes = ["mock"]

[tool.robocop.lint]
configure = ["line-too-long.line_length=140"]
ignore = ["DOC01", "DOC02", "DOC03", "DOC04"]
