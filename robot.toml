paths = "tests"
# log-level = "TRACE"

# ---------------------------------------------------------------------------
# Acceptance lanes need DIFFERENT native builds and CANNOT share one:
# a mock-provider build makes `Runtime()` resolve the built-in mock tree
# instead of the real platform provider. Tests are tagged by build requirement:
#   tag `real` -> needs the non-mock build      (just build-native)
#   tag `mock` -> needs the mock-provider build  (just build-native-mock)
# Pair the build with the tag/profile (CI: a separate job per lane).
# ---------------------------------------------------------------------------

# Real-provider acceptance lane: drive the test apps under tests/acceptance/ (egui
# today) through the real platform runtime, inside an isolated session set up by
# scripts/platynui-robot-session.sh. REQUIRES the non-mock native build
# (just build-native). Run with:
#   uv run scripts/startcompositor.sh -- scripts/platynui-robot-session.sh   # Wayland
#   uv run scripts/startxsession.sh   -- scripts/platynui-robot-session.sh   # X11
# (the session script defaults to `robotcode --profile real run`).
[profiles.real]
description = "Real-provider acceptance suites under tests/acceptance (tag 'real'; needs the non-mock build)"
paths = ["tests/acceptance"]
includes = ["real"]

# Mock lane: drive the PlatynUI.BareMetal library against the built-in mock tree.
# Deterministic, needs no display, runs on any OS. REQUIRES the mock-provider
# native build (just build-native-mock). Run with `robotcode --profile mock run`
# (or `just test-baremetal`).
[profiles.mock]
description = "BareMetal RF suites against the built-in mock tree (tag 'mock'; needs the mock-provider build)"
paths = ["tests/BareMetal"]
includes = ["mock"]

[tool.robocop.lint]
configure = ["line-too-long.line_length=140"]
ignore = ["DOC01", "DOC02", "DOC03", "DOC04"]
