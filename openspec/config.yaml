# OpenSpec project config (schema validated by the CLI; see `openspec schemas`).
#
# Valid top-level keys: `schema` (required), `context`, `rules`. Anything else is
# silently ignored.
#   - `context`  : one string, injected as <project_context> into EVERY artifact
#                  prompt (proposal/specs/design/tasks). Hard limit 50 KB. It is a
#                  per-token cost on every generation, so it states only what helps
#                  the AI write good artifacts here and points at the repo's own
#                  files for project facts rather than copying them.
#   - `rules`    : map keyed by artifact ID -> list of extra constraints, injected
#                  only into that artifact's prompt. Valid IDs for `spec-driven`:
#                  proposal, specs, design, tasks. No wildcard/global bucket; an
#                  unknown key is warned about and does nothing. Per OpenSpec's
#                  docs, rules are short, general guardrails layered on top of each
#                  artifact's built-in instructions — a handful of checkable lines
#                  that apply to EVERY change of that type. Keep them generic; don't
#                  restate the schema or the repo's docs, and don't tailor them to
#                  one past change.

schema: spec-driven

context: |
  PlatynUI: a cross-platform native UI-automation toolkit for Robot Framework — a
  Rust core (UI model, XPath engine, runtime, platform/provider devices) with
  Python/PyO3 bindings.

  Source of truth (read the relevant file and conform to it; don't restate it):
  - AGENTS.md — orientation: the two stacked Rust/Python workspaces, the
    Rust<->Python boundary in packages/native, task routing, the canonical `just`
    commands, commit rules, and the English-everywhere / German-planning-docs rule.
  - README.md — the platform & provider support table; check it before promising
    behavior on a backend (Windows UIA, Linux X11/AT-SPI2, Wayland, macOS AX, mock).
  - dev-docs/ — per-area design docs (architecture, error-handling, testing-strategy,
    python-bindings, *-input, cli, inspector, platform-*).
  - CONTRIBUTING.md — contributor workflow and `just` recipes.

  Apply across all artifacts:
  - Testing follows dev-docs/testing-strategy.md (test layers, mock vs. real-provider
    lanes); specs, design, and tasks must conform to it.
  - When a doc and the code disagree, the code is reality but the doc captures intent —
    flag the gap rather than silently picking one.
rules:
  proposal:
    - "Scope Impact across every layer the change touches — Rust crates, Python/RF modules, and the tests that cover them — not just the headline change."
    - "Call out cross-cutting concerns: whether it needs a native rebuild, which platforms/providers it affects and their support status, and any BREAKING behavior change."
  specs:
    - "Write each scenario as one concrete acceptance criterion in Given/When/Then form — the BDD style Robot Framework supports, not full Gherkin — specific enough to become a single automated test."
    - "Cover failure and edge cases (timeouts, invalid input, fallbacks), not only the happy path."
    - "Note when a scenario can only be verified against a real provider rather than the mock."
  design:
    - "Back load-bearing claims with concrete code references (file:line), and separate what was verified against the real code from what is assumed."
    - "In the Migration Plan, state whether the change is additive or behavioral, whether it needs a native rebuild, and how to roll back."
  tasks:
    - "Test-first: derive tests from the spec scenarios and put them before the implementation they cover. When the spec targets the Robot Framework library, its RF test (a mock suite, plus an acceptance suite when a real platform is needed) comes first — driving the keyword/API from Robot early surfaces an awkward interface before it is built."
    - "Sequence native-binding rebuilds before the Python/RF work that depends on them."
    - "Finish with a verification step that runs the relevant `just` test recipes, with real-provider-only checks in the acceptance lane."
