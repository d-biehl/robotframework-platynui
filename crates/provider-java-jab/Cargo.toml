[package]
name = "platynui-provider-java-jab"
description = "Java Access Bridge backend of the PlatynUI Java provider, on Windows"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Everything is Windows-gated (including the workspace crates) so that
# non-Windows builds see an empty crate without unused-dependency warnings.
[target.'cfg(windows)'.dependencies]
platynui-core = { path = "../core" }
# Only for the agent-presence classification fact on a top-level window; a leaf
# crate that owns the handshake-path rule, with no PlatynUI dependencies of its own.
platynui-java-agent = { path = "../java-agent" }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
libloading = "0.9"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3.27"
