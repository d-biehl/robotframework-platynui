[package]
description = "Linux X11 platform backend for PlatynUI"
name = "platynui-platform-linux-x11"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

# Every module is Linux-only; other targets build an empty marker crate.
[target.'cfg(target_os = "linux")'.dependencies]
platynui-core = { path = "../core" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
x11rb = { version = "0.14", features = ["xtest", "xfixes", "randr", "shape", "res"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
