[package]
name = "playground"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []


[dependencies]
platynui-core = { path = "../core" }
platynui-runtime = { path = "../runtime" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

platynui-link = { path = "../link" }

[target.'cfg(target_os = "windows")'.dependencies]
platynui-platform-windows = { path = "../platform-windows" }
platynui-provider-windows-uia = { path = "../provider-windows-uia" }
platynui-provider-jab = { path = "../provider-jab" }
# Used by the throwaway `jab_spike` bin (OpenSpec change add-swing-test-app).
libloading = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
platynui-platform-linux = { path = "../platform-linux" }
platynui-provider-atspi = { path = "../provider-atspi" }

[target.'cfg(target_os = "macos")'.dependencies]
platynui-platform-macos = { path = "../platform-macos" }
platynui-provider-macos-ax = { path = "../provider-macos-ax" }
