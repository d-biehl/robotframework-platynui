[package]
name = "platynui-provider-atspi"
description = "AT-SPI accessibility provider for PlatynUI on Linux"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
platynui-core = { path = "../core" }
inventory = "0.3"
atspi-common = { version = "0.14", default-features = false }
atspi-connection = { version = "0.14", default-features = false }
atspi-proxies = "0.14"
zbus = "5"
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Dev-only: the `atspi_focus_watch` diagnostic example needs the atspi event-stream
# API (`wrappers` feature) and a Stream combinator. Kept out of the production lib
# build, which keeps `atspi-connection` at `default-features = false` above.
[dev-dependencies]
atspi-connection = { version = "0.14", features = ["wrappers"] }
futures-lite = "2"
