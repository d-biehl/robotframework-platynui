[package]
name = "platynui-provider-atspi"
description = "AT-SPI accessibility provider for PlatynUI on Linux"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
platynui-core = { path = "../core" }
inventory = "0.3"
atspi-common = { version = "0.14", default-features = false }
# `wrappers` provides the event-stream API (`register_event` / `event_stream`),
# used by the popup watcher (src/popups.rs) and the `atspi_focus_watch` example.
atspi-connection = { version = "0.14", default-features = false, features = ["wrappers"] }
atspi-proxies = "0.14"
zbus = "5"
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Stream/future combinators and a timer for the popup watcher's event loop; both
# already in the tree via zbus.
futures-lite = "2"
async-io = "2"
