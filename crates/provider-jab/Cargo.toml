[package]
name = "platynui-provider-jab"
description = "Java Access Bridge provider for PlatynUI on Windows"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Everything is Windows-gated (including the workspace crates) so that
# non-Windows builds see an empty crate without unused-dependency warnings.
[target.'cfg(windows)'.dependencies]
platynui-core = { path = "../core" }
inventory = "0.3"
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
libloading = "0.8"
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3.27"
# Live fixture tests (tests/live_fixture.rs, #[ignore]-gated): real window
# manager for the window-capability patterns, real UIA provider for the
# frozen-JVM isolation check, and debug-API access to freeze the fixture JVM.
platynui-platform-windows = { path = "../platform-windows" }
platynui-provider-windows-uia = { path = "../provider-windows-uia" }
windows = { version = "0.62", features = ["Win32_System_Diagnostics_Debug"] }
