[package]
name = "platynui-wayland-compositor"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Wayland compositor for UI test automation with PlatynUI on Linux (Wayland and X11 applications)"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland compositor framework
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_glow",
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "xwayland",
] }

# Event loop
calloop = "0.14"

# EI protocol (libei/libeis) — input emulation server
reis = { version = "0.7", features = ["calloop"] }
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }

# D-Bus — XDG Desktop Portal queries (color-scheme detection)
zbus = { version = "5", features = ["blocking-api"] }

# Winit CSD fallback — GNOME doesn't support SSD (zxdg_decoration_manager_v1),
# so clients must draw their own decorations.  This activates Adwaita-themed
# CSD in winit's SCTK backend for compositors that don't provide SSD.
# On sway/KDE (which support SSD), this is unused — the host draws the frame.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# CPU-side titlebar rendering (backgrounds, buttons, rounded rects)
tiny-skia = "0.12"

# Font introspection, shaping, and glyph rasterization for titlebars
swash = "0.2"

# System font discovery
fontdb = "0.23"

# Screenshot encoding
png = "0.18"

# Cursor theme loading (xcursor images for screencopy / software cursor)
xcursor = "0.3"

# Configuration file
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Signal handling
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Minimal raw Wayland client for the ipc_tests popup fixture (the egui test
# app cannot create xdg_popups — its menus render in-window). Both crates are
# already in the dependency tree via smithay/winit.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[lints]
workspace = true

[lib]
name = "platynui_wayland_compositor"
path = "src/lib.rs"

[[bin]]
name = "platynui-wayland-compositor"
path = "src/main.rs"
