[package]
name = "platynui-wayland-compositor"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
description = "Wayland compositor for UI test automation with PlatynUI on Linux (Wayland and X11 applications)"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland compositor framework. Taken from git: smithay's last crates.io release
# (0.7.0) predates fixes and protocol modules the compositor relies on. Pinned
# to the master commit of 2026-11-24; move it only as CONTRIBUTING.md §7 says.
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "54cf9c10fe214066f2e69f43784aafde0d921682", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_glow",
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "xwayland",
    "backend_libei",
] }

# Event loop
calloop = "0.14"

# EI protocol (libei/libeis) — input emulation server
reis = { version = "0.7", features = ["calloop"] }
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }

# D-Bus — XDG Desktop Portal queries (color-scheme detection)
zbus = { version = "5", features = ["blocking-api"] }

# Winit CSD fallback — GNOME doesn't support SSD (zxdg_decoration_manager_v1),
# so clients must draw their own decorations.  This activates Adwaita-themed
# CSD in winit's SCTK backend for compositors that don't provide SSD.
# On sway/KDE (which support SSD), this is unused — the host draws the frame.
winit = { version = "0.31.0-beta.4", default-features = false, features = ["wayland-csd-adwaita"] }

# CPU-side titlebar rendering (backgrounds, buttons, rounded rects)
tiny-skia = "0.12"

# Font introspection, shaping, and glyph rasterization for titlebars
swash = "0.2"

# System font discovery
fontdb = "0.24"

# Screenshot encoding
png = "0.18"

# Cursor theme loading (xcursor images for screencopy / software cursor)
xcursor = "0.3"

# Configuration file
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Signal handling
signal-hook = "0.4"

# Peer credentials of an accepted connection (SO_PEERCRED). A safe wrapper that
# can represent a process id of 0 — the kernel's answer for a peer in a PID
# namespace this process cannot see. rustix' non-zero `Pid` cannot hold that
# value and std's `UnixStream::peer_cred` is still unstable
# (rust-lang/rust#42839), so `nix` is what avoids an `unsafe` block here.
nix = { version = "0.31", default-features = false, features = ["socket"] }

# Killing an Xwayland that failed to start through the pidfd smithay keeps for it
# (`pidfd_send_signal`). Already in the tree with this feature through smithay.
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Minimal raw Wayland clients for the integration tests: the popup fixture (the
# egui test app cannot create xdg_popups — its menus render in-window) and the
# protocol clients of the input-emulation, screen-capture and protocol-policy
# tests (staging: image capture, pointer warp; wlr: virtual pointer; misc:
# virtual keyboard). All of these crates are already in the dependency tree via
# smithay/winit and platynui-platform-linux-wayland.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# Waiting on the Wayland and EI client sockets with a deadline (poll).
rustix = { version = "1", features = ["event"] }
# X11 client for the Xwayland geometry tests (already in the tree via smithay).
x11rb = "0.14"

[lints]
workspace = true

[lib]
name = "platynui_wayland_compositor"
path = "src/lib.rs"

[[bin]]
name = "platynui-wayland-compositor"
path = "src/main.rs"
