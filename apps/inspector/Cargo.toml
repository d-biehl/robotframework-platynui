[package]
name = "platynui-inspector"
version.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
mock-provider = [
    "platynui-runtime/mock-provider",
    "dep:platynui-provider-mock",
    "dep:platynui-platform-mock",
]

[dependencies]
# `persistence` backs the settings storage (configured picker combination).
eframe = { version = "0.34", features = ["glow", "persistence"] }
egui_extras = "0.34"
egui-system-fonts = "0.34"
egui-async = "0.4"
clap = { version = "4", features = ["derive"] }
# Persisted Inspector settings (picker activation combination).
serde = { version = "1", features = ["derive"] }
# Config-dir resolution for the settings file (already in the tree via eframe/persistence).
home = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# Mock providers (optional)
platynui-provider-mock = { path = "../../crates/provider-mock", optional = true }
platynui-platform-mock = { path = "../../crates/platform-mock", optional = true }

# Internal crates
platynui-core = { path = "../../crates/core" }
platynui-runtime = { path = "../../crates/runtime", default-features = false }
platynui-link = { path = "../../crates/link" }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
platynui-platform-windows = { path = "../../crates/platform-windows" }
platynui-provider-windows-uia = { path = "../../crates/provider-windows-uia" }
platynui-provider-jab = { path = "../../crates/provider-jab" }
winreg = "0.56"
# Inspector-internal global modifier reading for the live picker (GetAsyncKeyState).
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
platynui-platform-linux = { path = "../../crates/platform-linux" }
platynui-provider-atspi = { path = "../../crates/provider-atspi" }
# Inspector-internal global modifier reading for the live picker (X11 XQueryPointer mask).
x11rb = "0.13"
# Modifier reading under the PlatynUI compositor (get_modifiers over the control socket).
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
platynui-platform-macos = { path = "../../crates/platform-macos" }
platynui-provider-macos-ax = { path = "../../crates/provider-macos-ax" }

[lib]
name = "platynui_inspector"
path = "src/lib.rs"

[[bin]]
name = "platynui-inspector-rs"
path = "src/main.rs"
