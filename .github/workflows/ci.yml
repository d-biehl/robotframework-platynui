name: CI

on:
  push:
    branches: [main, new_core]
    tags: ["v*"]
  pull_request:
    branches: [main, new_core]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt, ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install tools (just)
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Bootstrap environment
        run: just bootstrap

      - name: Check Rust formatting
        run: just fmt-check

      - name: Lint Python (ruff)
        run: just ruff

      - name: Type-check Python (mypy)
        run: just mypy

  rust:
    name: Rust (clippy, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig-dev \
            clang \
            libasound2-dev \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libseat-dev \
            libinput-dev \
            libgbm-dev \
            libgl1-mesa-dri \
            libegl1 \
            libegl-mesa0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install tools (nextest, just)
        uses: taiki-e/install-action@v2
        with:
          tool: nextest,just

      - name: Lint Rust (clippy)
        run: just clippy

      - name: Build Rust workspace
        run: just build

      - name: Run Rust tests
        run: just test

  python:
    name: Python (pytest, RF mock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig-dev \
            clang \
            libasound2-dev \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libseat-dev \
            libinput-dev \
            libgbm-dev \
            libgl1-mesa-dri \
            libegl1 \
            libegl-mesa0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install tools (just)
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Bootstrap environment
        run: just bootstrap

      - name: Run Python tests
        run: just test-python

      - name: Run BareMetal RF (mock) tests
        run: just test-baremetal

      - name: RF test summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f results/output.xml ]; then
            just test-summary >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Real-provider acceptance lane (egui app, headless) ────────────────────────

  acceptance-linux:
    name: Acceptance (Linux, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, compositor]
    env:
      # egui renders via Mesa's software rasteriser (runners have no GPU).
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install -y \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libfontconfig-dev \
            clang \
            libasound2-dev \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libseat-dev \
            libinput-dev \
            libgbm-dev \
            xserver-xephyr \
            xvfb \
            icewm \
            dbus-x11 \
            at-spi2-core \
            libglib2.0-bin \
            x11-xkb-utils \
            libxkbcommon-x11-0 \
            fuse3 \
            libgl1-mesa-dri

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install tools (just)
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Bootstrap environment
        run: just bootstrap

      # CI=true (set by GitHub Actions) makes `headless` default to true, so the
      # compositor uses its headless backend and X11 runs under Xvfb — no flag needed.
      - name: Run acceptance lane (${{ matrix.backend }}, headless)
        run: just test-acceptance-${{ matrix.backend }}

      - name: Dump egui app logs on failure
        if: failure()
        run: |
          echo "=== egui app logs (stdout+stderr merged) ==="
          mapfile -t logs < <(find /tmp /var/tmp /home /run -maxdepth 6 -name 'egui-*.log' 2>/dev/null | sort -u)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "(no egui-*.log found under /tmp /var/tmp /home /run)"
          fi
          for f in "${logs[@]}"; do
            echo "----- $f -----"
            cat "$f" || true
            echo
          done

      - name: RF test summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f results/output.xml ]; then
            just test-summary >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Linux manylinux wheels (container-based) ──────────────────────────────────

  build-wheels:
    name: Build wheels
    needs: [lint, rust, python, acceptance-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install tools (just, git-cliff)
        uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff

      - name: Update versions from git
        run: uv run scripts/update-git-versions.py

      - name: Update changelog
        run: uv run scripts/update-changelog.py

      - name: Bootstrap environment
        run: just bootstrap

      - name: Build PlatynUI pure-Python wheel
        run: just build-platynui-wheel

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-pure-python
          path: dist/*.whl
          if-no-files-found: error

  build-wheels-linux:
    name: Build wheels (Linux ${{ matrix.target }})
    needs: [lint, rust, python, acceptance-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            os: ubuntu-latest
            manylinux: 2_34
            container: quay.io/pypa/manylinux_2_34_x86_64:latest
          - target: aarch64
            os: ubuntu-24.04-arm
            manylinux: 2_34
            container: quay.io/pypa/manylinux_2_34_aarch64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install tools (just, git-cliff)
        uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff

      - name: Update versions from git
        run: uv run scripts/update-git-versions.py

      - name: Update changelog
        run: uv run scripts/update-changelog.py

      - name: Bootstrap environment
        run: just bootstrap

      - name: Build native wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release -m packages/native/Cargo.toml -o dist -i python3.12
          before-script-linux: |
            yum install -y libxkbcommon-devel

      - name: Build CLI wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release -m packages/cli/Cargo.toml -o dist
          before-script-linux: |
            yum install -y libxkbcommon-devel

      - name: Build Inspector wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release -m packages/inspector/Cargo.toml -o dist
          before-script-linux: |
            yum install -y libxkbcommon-devel

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ── macOS / Windows wheels ─────────────────────────────────────────────────────

  build-wheels-macos-windows:
    name: Build wheels (${{ matrix.os }})
    needs: [lint, rust, python, acceptance-linux]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python (Windows ARM)
        if: matrix.os == 'windows-11-arm'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Set up uv
        if: matrix.os != 'windows-11-arm'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up uv (Windows ARM)
        if: matrix.os == 'windows-11-arm'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Point uv to setup-python interpreter (Windows ARM)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: echo "UV_PYTHON=python" >> $env:GITHUB_ENV

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install tools (just, git-cliff)
        uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff

      - name: Add Rust tool bin directories to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          if (Test-Path $cargoBin) {
            $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Update versions from git
        run: uv run scripts/update-git-versions.py

      - name: Update changelog
        run: uv run scripts/update-changelog.py

      - name: Bootstrap environment
        run: just bootstrap

      - name: Build native wheel (platynui-native)
        run: just build-native-wheel

      - name: Build CLI wheel (platynui-cli)
        run: just build-cli-wheel

      - name: Build Inspector wheel (platynui-inspector)
        run: just build-inspector-wheel

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
